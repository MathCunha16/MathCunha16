name: Metrics
on:
  schedule: [{ cron: "0 0 * * 0" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: MathCunha16
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, languages
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 8
