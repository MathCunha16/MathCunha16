name: Metrics
on:
  schedule: [{cron: "0 0 * * 0"}]
  workflow_dispatch:
  push: {branches: ["main"]}      # Altere se o branch principal não for 'main'
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: MathCunha16
          template: classic
          base: header, languages
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 8